name: Update schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
      timezone: "Europe/Moscow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить библиотеки
        run: |
          pip install pdfplumber requests

      - name: Скачать расписание
        run: python download_schedule.py

      - name: Распарсить расписание
        run: python parse_schedule.py

      - name: Сохранить schedule.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git commit -m "Update schedule" || echo "Нет изменений"
          git push
